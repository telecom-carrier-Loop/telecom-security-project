apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-web
  namespace: telecom
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels: {app: telecom-web}
  template:
    metadata:
      labels: {app: telecom-web}
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: telecom-web}
              topologyKey: kubernetes.io/hostname
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: ghcr.io/telecom-carrier-loop/telecom-web:REPLACE_WITH_COMMIT_SHA
          ports: [{name: http, containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
          volumeMounts:
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: cache, emptyDir: {sizeLimit: 64Mi}}
        - {name: run, emptyDir: {sizeLimit: 8Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
