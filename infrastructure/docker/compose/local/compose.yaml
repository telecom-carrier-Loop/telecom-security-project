name: telecom-local

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run infrastructure/tools/prepare-local.py first}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_NAME:-telecom}
      MYSQL_USER: ${DB_USER:-telecom_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run infrastructure/tools/prepare-local.py first}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    profiles: [app]
    build:
      context: ../../../../backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-telecom}
      DB_USER: ${DB_USER:-telecom_app}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    profiles: [app]
    build:
      context: ../../../../frontend
      dockerfile: ../infrastructure/docker/frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236}
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]

  edge:
    profiles: [app]
    image: ${NGINX_IMAGE:-nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236}
    ports:
      - 127.0.0.1:8080:80
      - 127.0.0.1:8443:443
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../../../../.secrets/tls/server.crt
        target: /etc/nginx/tls/server.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../../../../.secrets/tls/server.key
        target: /etc/nginx/tls/server.key
        read_only: true
        bind: {create_host_path: false}
    depends_on: [web, api]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]

  migrate:
    profiles: [ops]
    build:
      context: ../../../..
      dockerfile: infrastructure/docker/migration/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-telecom}
      DB_USER: ${MIGRATION_DB_USER:?Set a DDL-capable local migration account}
      DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set the migration credential locally}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
