name: telecom-pc1
services:
  mysql:
    build:
      context: .
      args: {REPLICATION_ROLE: primary}
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root-password
      MYSQL_DATABASE: telecom
    ports:
      - "${PRIMARY_IP:?Set PRIMARY_IP in .env.shared-pc}:${PRIMARY_PORT:-3306}:3306"
    volumes:
      - data:/var/lib/mysql
      - type: bind
        source: ${SHARED_SECRET_ROOT:-../../../../.secrets/shared-pc}/pc1/root-password
        target: /run/secrets/root-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${SHARED_SECRET_ROOT:-../../../../.secrets/shared-pc}/pc1/tls
        target: /run/secrets/tls
        read_only: true
        bind: {create_host_path: false}
    tmpfs: [/run/mysql-tls:mode=0755]
    mem_limit: 2g
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s
    restart: unless-stopped
volumes:
  data:
